# Checks the repository rules on every pull request and push to main.
# Reusable: a project repository calls it with
#   jobs:
#     check:
#       uses: klangche/repo-starter/.github/workflows/check.yml@main
# The script is inline because a calling repository has no copy of this one.
name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository rules
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: python
        run: |
          import csv, glob, os, re, subprocess, sys

          errors = []

          # In the starter, and in a copy before its setup pull request, the
          # project files are in template/. After setup they are at the root.
          root = "template" if os.path.isdir("template/docs") else "."

          def at(path):
              return os.path.normpath(os.path.join(root, path))

          def fail(msg):
              errors.append(msg)

          def front_matter(path):
              text = open(path, encoding="utf-8").read()
              m = re.match(r"---\n(.*?)\n---\n", text, re.S)
              if not m:
                  return None
              return dict(re.findall(r"^(\w+):[ \t]*(.*)$", m.group(1), re.M))

          # Required files.
          required = ["AGENTS.md", "CLAUDE.md"] + [at(p) for p in [
              "README.md",
              "docs/BUILD.md", "docs/CODING.md", "docs/ADOPT.md",
              "docs/PLANNER.md", "docs/STATUS.md", "docs/VERSIONS.md",
              "docs/languages.csv", "docs/READ_ME_FIRST.txt",
              "changes/_TEMPLATE.md", "status/_TEMPLATE.md",
          ]]
          for path in required:
              if not os.path.isfile(path):
                  fail(f"missing required file: {path}")

          # AGENTS.md and CLAUDE.md must be identical.
          if os.path.isfile("AGENTS.md") and os.path.isfile("CLAUDE.md"):
              if open("AGENTS.md", "rb").read() != open("CLAUDE.md", "rb").read():
                  fail("AGENTS.md and CLAUDE.md differ")

          # Project type and languages in docs/BUILD.md.
          if os.path.isfile(at("docs/BUILD.md")):
              build = open(at("docs/BUILD.md"), encoding="utf-8").read()
              allowed = {"none", "powershell", "html", "web", "cli", "library",
                         "app-windows", "app-macos", "app-both"}
              m = re.search(r"^- `project-type`:[ \t]*(.*)$", build, re.M)
              if not m or not m.group(1).strip():
                  fail(f"{at('docs/BUILD.md')}: project-type is empty")
              else:
                  for value in m.group(1).split(","):
                      if value.strip() not in allowed:
                          fail(f"{at('docs/BUILD.md')}: unknown project-type '{value.strip()}'")
              m = re.search(r"^- `languages`:[ \t]*(.*)$", build, re.M)
              if not m or not m.group(1).strip():
                  fail(f"{at('docs/BUILD.md')}: languages is empty")

          # docs/languages.csv: UTF-8, key and en first, full rows, unique keys.
          try:
              with open(at("docs/languages.csv"), encoding="utf-8", newline="") as f:
                  rows = list(csv.reader(f))
          except (OSError, UnicodeDecodeError) as e:
              rows = []
              fail(f"docs/languages.csv: cannot read as UTF-8 ({e})")
          if rows:
              header = rows[0]
              if header[:2] != ["key", "en"]:
                  fail("docs/languages.csv: header must start with key,en")
              keys = set()
              for n, row in enumerate(rows[1:], start=2):
                  if len(row) != len(header):
                      fail(f"docs/languages.csv:{n}: expected {len(header)} columns, got {len(row)}")
                      continue
                  if not row[0] or not row[1]:
                      fail(f"docs/languages.csv:{n}: key and en must be filled in")
                  if row[0] in keys:
                      fail(f"docs/languages.csv:{n}: duplicate key '{row[0]}'")
                  keys.add(row[0])

          # Front matter of change and status files.
          skip = {"README.md", "_TEMPLATE.md"}
          types = {"Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"}
          bumps = {"patch", "minor", "major"}
          states = {"In progress", "Blocked", "Review", "Done"}
          for path in sorted(glob.glob(at("changes/*.md"))):
              if os.path.basename(path) in skip:
                  continue
              fm = front_matter(path)
              if fm is None:
                  fail(f"{path}: missing front matter")
                  continue
              if fm.get("type") not in types:
                  fail(f"{path}: type must be one of {sorted(types)}")
              if fm.get("bump") not in bumps:
                  fail(f"{path}: bump must be one of {sorted(bumps)}")
          for path in sorted(glob.glob(at("status/*.md"))):
              if os.path.basename(path) in skip:
                  continue
              fm = front_matter(path)
              if fm is None:
                  fail(f"{path}: missing front matter")
              elif fm.get("state") not in states:
                  fail(f"{path}: state must be one of {sorted(states)}")

          # A pull request adds exactly one change file.
          # Release pull requests and the skip-changes label are exempt.
          labels = os.environ.get("LABELS", "").split(",")
          head_ref = os.environ.get("HEAD_REF", "")
          if (os.environ.get("EVENT") == "pull_request"
                  and "skip-changes" not in labels
                  and not head_ref.startswith("release/")):
              # Diff the whole tree so that moved files count as renames,
              # not as added files.
              out = subprocess.run(
                  ["git", "diff", "--name-only", "-M", "--diff-filter=A",
                   os.environ["BASE_SHA"] + "...HEAD"],
                  capture_output=True, text=True, check=True).stdout.split()
              added = [p for p in out if os.path.dirname(p) == at("changes")
                       and os.path.basename(p) not in skip]
              if len(added) != 1:
                  fail(f"pull request must add exactly one file in changes/, found {len(added)}")

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print("All checks passed.")
