# Builds the release zip for `powershell` and `html` projects and publishes it
# under Releases. Starts when a version tag (vX.Y.Z) is pushed. See
# docs/BUILD.md, "Program types" and "Release flow".
# The zip holds the contents of src/ and READ_ME_FIRST.txt at its root, and is
# named <name>-<version>-<platform>.zip, for example ToolName-1.2.0-Windows.zip.
# Reusable: a project repository calls it with
#   on:
#     push:
#       tags: ['v*.*.*']
#   permissions:
#     contents: write
#   jobs:
#     release-zip:
#       uses: klangche/repo-starter/.github/workflows/release-zip.yml@main
#       with:
#         name: ToolName
#         platform: Windows
name: release-zip
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      name:
        description: Program name in the file name. Defaults to the repository name.
        type: string
        default: ''
      platform:
        description: Platform in the file name.
        type: string
        default: Windows

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      NAME: ${{ inputs.name || github.event.repository.name }}
      PLATFORM: ${{ inputs.platform || 'Windows' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          types=$(sed -n 's/^- `project-type`:[[:space:]]*//p' docs/BUILD.md)
          if ! echo "$types" | tr ',' '\n' | tr -d ' \t' | grep -qx 'powershell\|html'; then
            echo "::notice::project-type in docs/BUILD.md is '$types', not powershell or html. Nothing to zip."
            exit 0
          fi
          if [ ! -d src ] || [ -z "$(ls -A src)" ]; then
            echo "::error::src/ is missing or empty. Put the files to ship in src/."
            exit 1
          fi
          zip_name="$NAME-${TAG#v}-$PLATFORM.zip"
          mkdir -p dist/stage
          cp -R src/. dist/stage/
          cp docs/READ_ME_FIRST.txt dist/stage/
          (cd dist/stage && zip -qr "../$zip_name" .)
          echo "ZIP=dist/$zip_name" >> "$GITHUB_ENV"
      - name: Publish release
        if: env.ZIP != ''
        run: gh release create "$TAG" "$ZIP" --title "$TAG" --notes "See docs/VERSIONS.md for what changed in $TAG."
