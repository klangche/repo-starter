# repo-starter: creates the labels from AGENTS.md section 6 that are
# missing. Never edits or deletes existing labels.
name: labels
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          have=$(gh label list --limit 500 --json name -q '.[].name')
          while IFS='|' read -r name color desc; do
            grep -qxF "$name" <<<"$have" && continue
            gh label create "$name" --color "$color" --description "$desc"
          done <<'EOF'
          plan|5319e7|Plan issue: goal with ordered sub-issues
          enhancement|a2eeef|New feature (feat/)
          bug|d73a4a|Bug fix (fix/, debug/, hotfix)
          documentation|0075ca|Documentation (docs/)
          release|0e8a16|dev to main release
          breaking|b60205|Breaking change (! in title)
          blocked|000000|Waiting on another issue
          EOF
