# Fails when a commit reaches main without a pull request, so the owner
# notices. It cannot block the push. See AGENTS.md section 10.
# Reusable: a project repository calls it with
#   on:
#     push:
#       branches: [main]
#   jobs:
#     main-guard:
#       uses: klangche/repo-starter/.github/workflows/main-guard.yml@main
name: main-guard
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  main-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const shas = context.payload.commits.map(c => c.id);
            const direct = [];
            for (const sha of shas) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit(
                { owner, repo, commit_sha: sha });
              if (!data.some(p => p.merged_at)) direct.push(sha);
            }
            if (direct.length) {
              core.setFailed(`Pushed to main without a merged pull request: ${direct.join(', ')}`);
            } else {
              core.info(`All ${shas.length} commits came from merged pull requests.`);
            }
